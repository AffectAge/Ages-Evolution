[itemSize]
	#Largest item size accepted by normal and trapped chests.
	#Allowed Values: TINY, VERY_SMALL, SMALL, NORMAL, LARGE, VERY_LARGE, HUGE
	chestMaximumSize = "LARGE"
	#Largest item size accepted by bundles.
	#Allowed Values: TINY, VERY_SMALL, SMALL, NORMAL, LARGE, VERY_LARGE, HUGE
	bundleMaximumSize = "NORMAL"
	#Optional adapter overrides in the form block|namespace:id=size or item|namespace:id=size.
	#An entry only has an effect when that container has an Item Size adapter.
	containerOverrides = []

	[itemSize.pitKiln]
		#Largest item size that uses the normal Pit Kiln batch capacity.
		#Allowed Values: TINY, VERY_SMALL, SMALL, NORMAL, LARGE, VERY_LARGE, HUGE
		batchableMaximumSize = "LARGE"
		#Maximum Pit Kiln input count for items at or below the batchable size.
		# Default: 4
		# Range: 1 ~ 64
		batchSize = 4
		#Maximum Pit Kiln input count for items above the batchable size.
		# Default: 1
		# Range: 1 ~ 64
		oversizedBatchSize = 1

	[itemSize.rejectionFeedback]
		#Shows an action-bar explanation when a player tries to insert an oversized item.
		actionbarEnabled = true
		#Plays a short rejection sound when a player tries to insert an oversized item.
		soundEnabled = true
		#Minimum delay between repeated Item Size rejection feedback for one player.
		# Default: 20
		# Range: 0 ~ 200
		cooldownTicks = 20
		#Volume of the Item Size rejection sound.
		# Default: 0.45
		# Range: 0.0 ~ 2.0
		soundVolume = 0.45
		#Pitch of the Item Size rejection sound.
		# Default: 0.6
		# Range: 0.1 ~ 2.0
		soundPitch = 0.6

