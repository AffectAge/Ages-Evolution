[dryingRack]
	#Allows item-handler automation. Disabled by default to preserve manual early-game play.
	automationEnabled = false
	#Allows vertically stacked normal drying racks to act as ladders.
	ladderEnabled = true
	#Vertical climb speed for stacked normal drying racks.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	ladderClimbSpeed = 0.1
	#Final speed multiplier for the crude drying rack.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	crudeMultiplier = 1.0
	#Final speed multiplier for the normal drying rack.
	# Default: 1.35
	# Range: 0.0 ~ 100.0
	normalMultiplier = 1.35
	#Duration multiplier applied to recipes processed by the crude drying rack.
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	crudeBaseRecipeDurationModifier = 1.0
	#Duration multiplier applied to every recipe processed by the normal drying rack.
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	normalBaseRecipeDurationModifier = 1.0
	#Additional duration multiplier for crude recipes inherited by the normal drying rack.
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	inheritedCrudeRecipeDurationModifier = 1.0
