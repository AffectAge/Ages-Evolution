name: Update FancyMenu release feed

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate FancyMenu feed from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          raw = subprocess.check_output([
              "gh", "api",
              f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/latest"
          ], text=True)
          release = json.loads(raw)

          tag = release.get("tag_name") or "UNKNOWN"
          name = release.get("name") or tag
          body = (release.get("body") or "No release notes were provided.").strip()
          published = release.get("published_at") or "unknown"
          url = release.get("html_url") or f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases"

          feed = f"""# AGES EVOLUTION\n\n**SYSTEM STATUS:** ONLINE  \n**VERSION:** `{tag}`  \n**RELEASED:** `{published}`\n\n---\n\n## LATEST UPDATE\n\n### {name}\n\n{body}\n\n---\n\n[OPEN FULL RELEASE NOTES]({url})  \n[OPEN GITHUB REPOSITORY](https://github.com/{os.environ['GITHUB_REPOSITORY']})\n"""

          path = Path("src/config/fancymenu/assets/ages-evolution-feed.md")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(feed, encoding="utf-8")
          PY

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/fancymenu/assets/ages-evolution-feed.md
          git diff --cached --quiet || git commit -m "chore: update FancyMenu release feed"
          git push
